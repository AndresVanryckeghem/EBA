<!doctypehtml><html><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width,initial-scale=1"><title>Whoop</title><style>body{margin:0;background:#0d1b1e}</style></head><body><div id="fsw-mount"></div><script>!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n="ann%20wauters.mp3",a={title:"Whoop",tagline:"How a Harvard squash captain who couldn't recover built the wearable that redefined athletic performance",chapters:[{title:"The Athlete Who Couldn't Stop Falling Off the Cliff",beats:["#Will Ahmed arrived at Harvard as a recruited squash player, but at the bottom of the varsity lineup. Not the most talented, so he compensated by being the fittest: ^compensating with volume`: extra sprints, interval training, extra games.","Therefore he kept pushing harder. But something kept happening: ^fall off a cliff`: flat in matches he should win. Exhausted in the second game when he should only be tired in the fifth.","Therefore he started questioning what was happening. He was overtraining, and the bigger problem wasn't the training, it was the other ^other 20 hours`. Inconsistent sleep, parties, late nights. Comfortable pushing his body, doing nothing to recover it.","@The best founders work on problems they've lived. Will's insight came from his own body failing him.","Therefore he asked the question that would consume 13 years: ^how would you measure recovery?` That led to: what is sleep, actually? By graduation he had read around 500 medical papers.","But the tools were completely inaccessible. The PSG sleep machine was the gold standard, but you'd be wired up and videotaped, producing the worst night's sleep of your life. The ECG cost ^$20,000`. The chest strap was invented in 1982 and barely changed since.","@Will discovered a problem with a very clear limiting factor: three medical devices that worked in isolation, none of which worked on a wrist continuously.","Therefore by graduation Will had defined the problem: replace three pieces of medical equipment with one wrist-worn device measuring continuously, 24/7. He wrote a paper: ^'The Feedback Tool: Measuring Intensity, Recovery and Sleep.'` Those three metrics are still WHOOP's core today.","@Frame your problem so precisely that the solution becomes obvious. Will didn't say 'build a fitness tracker', he said 'replace these three specific devices with one.'","+The question was written. Could a ^21-year-old with no engineering background` actually build it?"]},{title:"The Business Plan as a Recruiting Weapon",beats:["#Will had a ^problem worth solving` but was 21, not a doctor, engineer, computer scientist, or designer. Essentially none of the things you'd need to build this product. He also didn't know what an entrepreneur was.","Therefore he did finance internships to test that path. But he kept being pulled back to the physiology problem. Starting the company had become, in his words, ^'an inevitability rather than a choice.'`","Therefore he took a class at MIT Sloan called New Enterprises and wrote a 75-page business plan. He kept meeting with the professor after the class ended until Howard Anderson stopped him: ^'At some point, is this a paper, or are you starting a company?'`","@Will used the business plan as proof of seriousness. A 75-page document signals commitment in a way a pitch deck never does.","But he needed talented engineers and had no track record. He used the business plan as his calling card: ^two documents proving this should exist`.","Therefore he found his co-founders. John Capatolupo, 19 years old, father an exercise physiology professor. Aurelian Nicolae, sleeping on John's couch after a job fell through, showed up with 3D-printed prototypes and was hired on the spot. ^The third hire needed a plane ticket.`","@Recruiting without resources forces you to sell the mission. Will's team joined because they believed in the problem, which meant they stayed when it got hard.","+Will had a ^team`. Now he needed the person who could make the data beautiful, and that person was in Hamburg."]},{title:"The Flight to Hamburg",beats:["#Will believed from day one: ^the data visualisation would define the business`. He needed the best information graphics designer in the world.","Therefore he Googled ^'best information graphics designer in the world.'` The second link was a profile of Martin Oberhauser in Hamburg, Germany. Will called him. Martin blew him off, busy, wrong country.","Therefore Will called him back: ^'If I flew to Hamburg, would you meet me for an hour?'` Then he got on a plane.","@Showing up in person when it's irrational is a credibility signal that can't be faked. Will passed a test Martin didn't know he was giving.","Therefore Martin agreed to meet. As Will described it: ^'When someone shows up to your doorstep with that much chutzpah, there is a credibility moment.` I passed a test in his eyes — I was serious, and a little bit crazy.","+Martin Oberhauser became their ^lead designer`. Will knew it the moment he boarded the plane."]},{title:"$300,000 and a Lot of Rejection",beats:["#Will had a ^team but no money`, and was 22 with no track record, pitching a complex hardware concept while rumours spread that Nike and Apple were both entering wearables.","Therefore he didn't go to VCs. He went to people who knew him personally: parents, friends, former bosses. The pitch wasn't technology, it was commitment. ^'The advantage of betting on a 22-year-old is they don't have a lot else going on.'`","But he faced ^more rejection in six months than in his entire life`. Everyone said the same: bad idea, you're not a doctor or engineer, and Nike and Apple are entering the space.","@By going to personal contacts instead of VCs, Will got investors betting on him as a person, which meant they stayed patient when the business model wasn't working yet.","Therefore Will leaned on his belief system. Some days he just felt like a loser. He kept going. By summer 2012 he had ^$300,000` from friends, family, and former bosses. Work began out of the Harvard Innovation Lab.","@$300k is not enough to build a hardware company. It was enough to prove the next thing, the only thing that matters at each stage.","+He had the team, the space, and just enough money. Now he needed to know: ^was this physically possible?`"]},{title:"The Eureka Moment From a $5 Sensor",beats:["#Even with money, Will didn't know if his core idea was possible. Could you actually ^measure HRV and sleep from a wristband?`","Therefore he walked into engineering labs across Boston, pitching his idea. But roughly two-thirds were dead ends, he looked like a kid with a science project. Every lab had the same first question: ^what's your budget?`","Therefore he kept pitching until he found believers. One lab surfaced the technique: ^photoplethysmography (PPG)`, shining light under the skin so it reflects off capillaries, with the signal's frequency interpreted as heart rate. The sensors were extremely cheap.","@The breakthrough was hiding in plain sight, used in hospital pulse oximeters for decades. Will didn't invent PPG. He was the first to ask if it could work on a wrist, continuously, in the real world.","Therefore in summer 2012 the team bought PPG sensors off the internet, put them on a fingertip, and got a resting heart rate reading. The physics worked. As Will put it: ^'This isn't defying physics.'`","+They had their ^eureka moment`. Now they had to turn a lab reading into something you'd wear every day of your life."]},{title:"The Box With the Cord",beats:["#Proving physics in a lab is not having a product. Will needed to prove it ^step by step`, and was perpetually short on cash.","Therefore he made an explicit decision: treat each prototype as a ^fundraising milestone`, not a product milestone. Each prototype was designed to unlock the next round, not to ship.","@Most founders build toward a product. Will built toward a proof.","Therefore Prototype 1 was ridiculous-looking: a wrist sensor wired to a box labelled 'Bobo,' wired to a computer. It looked like a science fair project. But it proved wrist-based HRV measurement was real, enough to raise ^$400,000`.","But a structural problem emerged: hardware and software were built on ^complete islands`. Software was designed assuming hardware would eventually arrive, a constant risk the two halves would never meet.","Prototype 2 went ^wireless via Bluetooth`. Battery: four hours. Manufacturability: unknown. Prove the milestone, unlock the round, keep moving.","@Hardware startups die when they confuse product completeness with investor confidence. Will kept them separate on purpose.","+The rhythm: ^prototype, fundraise, repeat` → next prototype. But the hardest technical problem was still ahead."]},{title:"The Algorithm Built for the Hardest Conditions",beats:["#PPG has ^predictable failure modes`. Darker skin is harder to read. Hairier skin is harder. Non-periodic motion, basketball, squash, is much harder than a treadmill run. And athletes are diverse.","Will used Harvard athletes as ^ground truth data`. WHOOP prototype on the wrist, Polar chest strap as ground truth. Exercise. Generate paired data. Repeat.","But he made a counterintuitive choice. Competitors ran studies on the easiest conditions: ^'30 white men walking on a treadmill indoors.'` Clean papers. Useless algorithms in the real world.","@Optimise for the easiest case and you get a product that works in demos and fails in life. Will optimised for the hardest case, every constraint led to a better decision.","WHOOP built its algorithm ^from the hardest case up`, dark skin, hairy skin, outdoor sports with non-periodic motion. This forced far more data, more battery, more bandwidth.","Therefore another decision followed: ^no screen.` Every milliamp of battery and every byte of bandwidth went to sensor accuracy. A worse UI than competitors, on purpose, because the alternative was a worse measurement.","@Great product strategy is a chain of 'therefore' decisions from one first principle. The no-screen decision wasn't cost-cutting, it was the logical conclusion of taking accuracy seriously.","+WHOOP had an algorithm ^that worked where competitors' didn't.` The no-screen tradeoff was about to become a feature, not a limitation."]},{title:"Saying No to the Step",beats:["#While Will was building, ^Fitbit was exploding and Jawbone was raising hundreds of millions`. Every wearable was a step counter. Investors kept asking when WHOOP would add steps.","Therefore Will had to make a positioning decision. He didn't think steps answered the strain/recovery equation. ^'How much stress on your body is a different question than how much you've moved your arm.'`","But the ^Nike Fuel Band` launched. Will had spent years afraid of Nike. If Nike got the world's best athletes to authentically wear their wearable, they could tell the same story Will wanted to tell.","@The day a feared competitor launches is often a relief. Nike had everything, and still took the shortcut. That told Will what winning actually required.","Therefore trying the Nike Fuel Band was a day of huge relief: just another step counter. A product LeBron would never actually wear. Nike built for the mass market, not the athlete. ^'That was a huge missed opportunity.'`","Therefore Will doubled down on no, not just steps, but no screen, no notifications, no phone calls, no microphone, no app store. ^'WHOOP is graded on all the things it does for all the things it doesn't do.'`","@Focus is a daily decision to say no to things that would be easy to say yes to. Will made that decision over and over, investor meeting after investor meeting.","+The strategic identity was clear: ^define yourself by what you refuse`. Now he had to get it onto the wrists of athletes who would make it credible."]},{title:"The Trainer Was the Gatekeeper",beats:["#By 2015 WHOOP had a working product at $500. The dream targets: ^LeBron James and Michael Phelps`. Reaching them normally would mean paying millions.","Will found the ^actual leverage point`. Personal trainers in 2015 had no endorsement deals. They lived with the athlete. They spent more time with the athlete than anyone else. The athletes trusted them on every health decision.","@The gatekeeper is rarely who you think it is. Will didn't try to reach LeBron, he reached the person LeBron trusted most with his body.","He seeded WHOOPs to trainers ^for free`. Mike Mancias, LeBron's trainer, started wearing one. He liked it enough to ask for a second unit to put on LeBron.","But Will did something unintuitive: when LeBron got his strap, ^WHOOP charged for it`. No likeness rights, no marketing deal. Just a paying customer who happened to be the best basketball player in the world.","@Paying customers are more valuable than endorsers. An endorser has an incentive to say the product is good. A paying customer who keeps paying has no incentive at all.","LeBron's team started wearing WHOOP in ^NBA games — not yet allowed by the league.` The 'scandal' went public. Will let it run. It created interest from other leagues, and WHOOP signed partnerships with MLB and the NFL.","Therefore Will was at home with his parents when a Kia commercial came on featuring LeBron, wearing a WHOOP strap. ^'You wouldn't even take it off for a Kia commercial.'`","+Two of WHOOP's first 100 users were ^LeBron James and Michael Phelps`. The product worked. The business model did not."]},{title:"The $500 Product Nobody Bought",beats:["#WHOOP launched to consumers in 2016. The bet: fitness enthusiasts will want what the pros use. But it flopped. The product cost ^$500 — more than an Apple Watch`.","Will had two contradictory signals. Bad: almost nobody was buying. Good: ^the few who bought never stopped wearing it` — unlike Fitbits, which ended up in drawers after three weeks.","@When retention is great and acquisition is broken, the business model is the problem, not the product. Will read the data correctly.","Therefore Will spent 2017 diagnosing the gap honestly. Retention said the product was good. Sales said the model was broken. The more he tinkered with hybrid pricing, the more he became obsessed: what if the whole thing was ^a subscription?` Hardware free, included with membership.","But the obvious problem: subscriptions mean ^far less money upfront`, and WHOOP was already capital-starved. Surviving the transition required more capital on the balance sheet.","@The best business model decisions are the most terrifying. Moving to subscription meant betting the company on a longer payback window, while close to running out of money.","Therefore Will made a ^'bet the company' decision`: pure subscription, hardware free, roughly $30/month. No more 12–18 month feature cycles. Features shipped the moment they were ready, because every member could cancel every month.","+The model was right — ^but survival wasn't guaranteed`. Now all he had to do was survive long enough to prove it."]},{title:"Eighteen Months on Three Months of Runway",beats:["#The transition to subscription combined with thin capital put WHOOP into ^perpetual fundraising`. For 18 straight months the company never had more than three months of runway. The team had grown to 50–70 people. These were jobs.","Will became a ^perpetual fundraiser`, stitching the company along through smaller investments, never enough for the standard two-year runway, just enough to keep going.","But then it got to the moment Will calls the closest he came to losing the company. If a term sheet wasn't signed Wednesday, WHOOP would file for bankruptcy Friday. ^Two days from extinction.`","@The moment you feel the company has already failed, before it actually has, is when most founders stop. Will felt all the feelings, then kept dialling.","Therefore Will drafted a note to all investors thanking them for the journey. He felt every feeling of the company having failed. And then: ^'I just kept picking up the phone. I kept calling. I kept trying.'`","The deal got done. ^WHOOP never did a down round.` Across its entire history, Will preferred bridge financings over a punitive valuation cut.","@Surviving a near-death experience without a down round is a decision, to protect the cap table even when the easier path is to take whatever terms are available.","+WHOOP survived. ^Amazon was watching.`"]},{title:"When Amazon Copied Them",beats:["#Around 2017–2018, Amazon's Alexa Fund approached WHOOP, first to invest, then to acquire. WHOOP wasn't selling. But Amazon's product team got ^deep access to the technology`, the thesis. Then they passed.","Therefore two years later, Amazon launched the Halo wristband, a near-direct knockoff. So brazen that Amazon's own product manager tweeted on launch day: ^'Whoop, there it is.'` Will called it 'a sickening level of we're above the law.'","But Will did the math. ^Suing Amazon would cost tens of millions.` and years of executive time. Amazon could fight indefinitely. They were, practically, above the law.","@Not every wrong is worth fighting the way it was committed. Will chose to fight where he could win, product, brand, and culture.","Therefore WHOOP did not sue. ^'We weren't going to win in court. We were going to win in the court of public opinion and with consumers.'`","Therefore Will turned it into a morale event. On every WHOOP 4.0 circuit board, engineers engraved: ^'Don't bother copying us. We will win.'` Every engineer had their initials on the board. The only person who'd ever see it was someone opening the hardware to copy it.","@Culture is built in moments of adversity. The circuit board inscription was a better culture intervention than any offsite.","+Amazon Halo was ^eventually discontinued`. WHOOP kept growing. The inscription stayed on the board."]},{title:"The Panic Attack That Built the Daily System",beats:["#In 2014, Will was 24. The company was 30–40 people. He'd raised $20 million. ^The company was struggling.` Too much coffee by day, too much alcohol at night. Strung out.","One day, driving on the highway, ^his peripheral vision started narrowing`. Fingers numb. Strange taste in his mouth. He drove himself to hospital.","But the diagnosis: ^a panic attack`. He had ended up in hospital from stress.","@The body knows the truth before the mind does. Will's panic attack was his system telling him something the spreadsheets couldn't.","Therefore two days later he signed up for Transcendental Meditation, 20 minutes every morning since, for over a decade. What it built was a ^'third person' awareness`: hearing 'Will is about to get angry' before getting angry. He calls this meta-awareness a superpower.","He built a ^daily stack` around controlling controllables. Morning workout. Steam room. Cold shower. Protein breakfast. Cold, dark bedroom. Consistent bedtime. Blue light glasses, the single biggest thing that boosted his own REM sleep on WHOOP.","@Will used his own product to optimise his recovery, then built those lessons back into how he ran the company. The CEO's habits became company culture.","+The panic attack reshaped ^how he led the company` but his operating model as CEO. Control what you can control. Ignore everything else."]},{title:"The Charger That Doesn't Make You Take It Off",beats:["#WHOOP's thesis needed ^24/7 wear` — but every wearable ever made had the same break: you take it off to charge. The second you take it off, you might not put it back on.","Therefore Will treated this as a first-principles problem. The convention: charge on a nightstand. The first principle: if health is 24/7, the device must be 24/7. ^Charging must happen on the body.`","@Every industry has conventions nobody questions because nobody has decided their first principle conflicts with them. Will's first principle made an accepted norm unacceptable.","Therefore WHOOP invented the modular charger, a battery brick that ^charges the device while still on your wrist`. Cost: ~$100 more per unit in manufacturing.","But another tension: ^a wristband can't be worn everywhere`. Some sports, some social settings make it impractical.","Therefore WHOOP built apparel, boxers, bras, arm sleeves, with pockets the sensor pops into. The sensor detaches from the wrist clasp. As Will put it: ^'It's crazy to start a wearables company and end up designing boxers, but that goes back to first principles.'`","@Follow a first principle far enough and it takes you somewhere unexpected. Will started with a wrist sensor and ended up in the apparel business, not because he wanted to, but because the principle demanded it.","+WHOOP had operationalised its core thesis: ^no excuse to ever take the device off`."]},{title:"The Subscription as Operating System",beats:["#With WHOOP growing, the temptation was to ^do more`, add features, expand categories. That's how most successful companies lose what made them successful.","Therefore Will actively resisted what he calls the cost of focus. ^'That's the biggest way success is a bad teacher, it makes you think you can do many things and abandon the intensity that built the original thing.'`","@Focus is hardest to maintain when things are going well. When failing, focus is survival. When succeeding, it's a choice, and a harder one.","The subscription model became the ^enforcement mechanism`. Because retention was monthly, the team couldn't debate becoming a watch. New features shipped the moment ready, not on a hardware cycle. Steps added via firmware update years later. A strength trainer. A stress monitor. An OpenAI coach.","Therefore internal culture reflected the same logic. The ^'sleep bonus'`, $100/month for employees maintaining ≥85% sleep performance on their own WHOOP. The COVID red recovery policy: red score means stay home. Either getting sick, or too run down.","@The most credible thing a health company can do is make its own employees live by the product's logic. WHOOP's internal policies weren't perks, they were proof of belief.","+WHOOP became defined as much by ^what it refused` as what it did. No watch. No screen. No notifications. No phone calls. No microphone. No app store. The answer to 'what is WHOOP?' was inseparable from 'what does WHOOP say no to?'"]}]},i=["The Problem","Co-founders","Design","First Investors","Prototype","Product Build","The Algorithm","Positioning","Go-to-Market","Pricing","Runway","Competition","Founder Health","Product Strategy","Business Model"],o=0,r=0,s="gateway",d=[],l={},c=0;t.innerHTML='<style>@import url(\'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap\');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:host{display:block;width:100%;--a:rgba(255,255,255,.05);--b:rgba(255,255,255,.1);--c:rgba(255,255,255,.3);--d:rgba(255,255,255,.025);--e:rgba(255,255,255,.08);--f:rgba(255,255,255,.25);--g:rgba(255,255,255,.07);--h:rgba(255,255,255,.5);--i:rgba(255,255,255,.75);--j:rgba(255,255,255,.45);--k:rgba(255,255,255,.04);--l:rgba(255,255,255,.12);--m:rgba(255,255,255,.09);--n:rgba(255,255,255,.4);--o:rgba(255,255,255,.15);--p:rgba(255,255,255,.7);--q:rgba(255,255,255,.2);--A:rgba(201,241,53,.6);--B:rgba(201,241,53,.3);--C:rgba(201,241,53,.4);--D:rgba(201,241,53,.5);--E:rgba(201,241,53,.12);--F:rgba(201,241,53,.06);--G:rgba(201,241,53,.7);--H:rgba(201,241,53,.2)}#shell{display:flex;width:100%;max-width:100%;min-height:92vh;font-family:\'Inter\',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0d1b1e;color:#f0ede8}\n\n\n#s-gate{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#162224 0%,#0a1416 70%,#0a1416 100%)}\n#s-gate.active{display:flex}\n#s-gate::before{content:\'\';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(201,241,53,.04) 0,transparent 50%),radial-gradient(circl
